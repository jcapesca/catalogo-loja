<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JCA Pesca & Bazar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#f4f6f9;padding-bottom:60px}
header{background:#0f4c81;color:#fff;padding:15px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.btn-cart{background:#25d366;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
.filtros{max-width:1000px;margin:15px auto;padding:0 15px}#busca{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px}
.cats{display:flex;gap:8px;overflow-x:auto}.cat-btn{background:#fff;border:1px solid #ddd;padding:6px 14px;border-radius:20px;cursor:pointer}
.cat-btn.ativa{background:#0f4c81;color:#fff}.grid{max-width:1000px;margin:0 auto;padding:0 15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;flex-direction:column;justify-content:space-between}
.card img{width:100%;height:120px;object-fit:contain;margin-bottom:8px}.preco{font-size:1.1rem;font-weight:bold;color:#0f4c81;margin:6px 0}
.btn-add{width:100%;background:#1e88e5;color:#fff;border:0;padding:9px;border-radius:6px;font-weight:bold;cursor:pointer}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;justify-content:flex-end}
.modal{background:#fff;width:100%;max-width:400px;height:100%;padding:20px;overflow-y:auto;display:flex;flex-direction:column;justify-content:space-between}
.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0}.campo{margin-top:10px}
.campo label{display:block;font-size:.85rem;font-weight:bold;margin-bottom:4px}.campo input,.campo select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px}
.btn-whats{width:100%;background:#25d366;color:#fff;border:0;padding:14px;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:15px}
</style>
</head>
<body>
<header><h2>JCA Pesca & Bazar</h2><button class="btn-cart" onclick="abrir()">🛒 Carrinho (<span id="qtd">0</span>)</button></header>
<div class="filtros"><input type="text" id="busca" placeholder="Buscar produto ou código..." oninput="filtrar()"><div class="cats" id="cats"></div></div>
<div class="grid" id="vitrine"><p>Carregando produtos...</p></div>
<div class="modal-bg" id="modal"><div class="modal"><div>
<div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3>Seu Pedido</h3><button onclick="fechar()" style="border:0;background:none;font-size:1.3rem;cursor:pointer">✕</button></div>
<div id="itens"></div><h3 style="margin-top:12px;text-align:right">Total: R$ <span id="total">0,00</span></h3>
<div class="campo"><label>Seu Nome *</label><input type="text" id="nome"></div>
<div class="campo"><label>Recebimento *</label><select id="entrega" onchange="mudarEnt()"><option value="Retirada na Loja">🏪 Retirar na Loja (Grátis)</option><option value="Entrega Local">🛵 Entrega Local / Motoboy</option><option value="Correios/Transportadora">📦 Correios / Transportadora</option></select></div>
<div class="campo" id="info-ret" style="background:#eef6ff;padding:8px;border-radius:6px;font-size:.85rem">📍 Retirada na Loja Física - São Gonçalo/RJ</div>
<div class="campo" id="box-end" style="display:none"><label>Endereço e CEP *</label><input type="text" id="end"></div>
<div class="campo"><label>Pagamento</label><select id="pag"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select></div>
</div><button class="btn-whats" onclick="enviar()">🚀 Enviar no WhatsApp</button></div></div>
<script>
const ID = "1aqXlxsuLk8KuyuDr73IDyI1ZtfFqSFoIko9lYg1M2N4";
const ZAP = "5521967601536";
let prods = [], cart = [], cat = "Todos";
const IMG = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='120' height='120' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='1.5'><rect x='3' y='3' width='18' height='18' rx='2'/><circle cx='8.5' cy='8.5' r='1.5'/><path d='M21 15l-5-5L5 21'/></svg>";

function receberDados(r) {
  prods = (r.table.rows || []).map(x => {
    const c = x.c || [];
    const v = i => (c.at(i) && c.at(i).v != null) ? String(c.at(i).v).trim() : "";
    const n = i => (c.at(i) && typeof c.at(i).v === "number") ? c.at(i).v : parseFloat(v(i).replace("R$","").replace(/\./g,"").replace(",",".")) || 0;
    return { sku: v(0), nome: v(1), cat: v(2) || "Geral", preco: n(3), foto: v(4).startsWith("http") ? v(4) : IMG, est: parseInt(n(5)) || 0 };
  }).filter(p => p.nome && p.nome.toLowerCase() !== "nome" && p.est > 0);
  document.getElementById("cats").innerHTML = ["Todos", ...new Set(prods.map(p => p.cat))].map(c => `<button class="cat-btn ${c==='Todos'?'ativa':''}" onclick="setCat('${c}',this)">${c}</button>`).join("");
  desenhar(prods);
}

const s = document.createElement("script");
s.src = "https://google.com" + ID + "/gviz/tq?tqx=out:script;responseHandler:receberDados&gid=0";
s.onerror = () => document.getElementById("vitrine").innerHTML = "<p>Erro ao acessar planilha. Verifique o compartilhamento.</p>";
document.body.appendChild(s);

function setCat(c, b){ cat = c; document.querySelectorAll(".cat-btn").forEach(x => x.classList.remove("ativa")); b.classList.add("ativa"); filtrar(); }
function filtrar(){ const t = document.getElementById("busca").value.toLowerCase(); desenhar(prods.filter(p => (cat === "Todos" || p.cat === cat) && (p.nome.toLowerCase().includes(t) || p.sku.toLowerCase().includes(t)))); }
function desenhar(l){ document.getElementById("vitrine").innerHTML = l.slice(0,60).map(p => `<div class="card"><div><img src="${p.foto}" onerror="this.src='${IMG}'"><small style="color:#777">Cód: ${p.sku}</small><div style="font-weight:bold;margin:4px 0">${p.nome}</div></div><div><div class="preco">R$ ${p.preco.toFixed(2).replace(".",",")}</div><button class="btn-add" onclick="add('${p.sku}')">+ Adicionar</button></div></div>`).join("") || "<p>Nenhum item com estoque encontrado.</p>"; }
function add(sku){ const i = cart.find(x => x.sku === sku); if(i) i.qtd++; else cart.push({...prods.find(x => x.sku === sku), qtd:1}); att(); }
function mQtd(sku, d){ const i = cart.findIndex(x => x.sku === sku); cart[i].qtd += d; if(cart[i].qtd <= 0) cart.splice(i,1); att(); }
function att(){ document.getElementById("qtd").innerText = cart.reduce((s,i)=>s+i.qtd,0); document.getElementById("total").innerText = cart.reduce((s,i)=>s+i.preco*i.qtd,0).toFixed(2).replace(".",","); document.getElementById("itens").innerHTML = cart.map(i => `<div class="item"><div><b>${i.nome}</b><br>R$ ${(i.preco*i.qtd).toFixed(2).replace(".",",")}</div><div><button onclick="mQtd('${i.sku}',-1)">-</button> ${i.qtd} <button onclick="mQtd('${i.sku}',1)">+</button></div></div>`).join("") || "<p>Carrinho vazio.</p>"; }
function abrir(){ document.getElementById("modal").style.display = "flex"; att(); }
function fechar(){ document.getElementById("modal").style.display = "none"; }
function mudarEnt(){ const r = document.getElementById("entrega").value === "Retirada na Loja"; document.getElementById("info-ret").style.display = r ? "block" : "none"; document.getElementById("box-end").style.display = r ? "none" : "block"; }
function enviar(){ if(!cart.length) return alert("Carrinho vazio!"); const n = document.getElementById("nome").value.trim(), e = document.getElementById("entrega").value, end = document.getElementById("end").value.trim(); if(!n) return alert("Digite seu nome."); if(e !== "Retirada na Loja" && !end) return alert("Digite endereço e CEP."); let m = `*PEDIDO - JCA Pesca & Bazar*\n*Cliente:* ${n}\n*Entrega:* ${e}\n` + (e !== "Retirada na Loja" ? `*Endereço:* ${end}\n` : "") + `*Pagamento:* ${document.getElementById("pag").value}\n\n`; cart.forEach(i => m += `• ${i.qtd}x ${i.nome} (Cód ${i.sku}) - R$ ${(i.preco*i.qtd).toFixed(2).replace(".",",")}\n`); m += `\n*TOTAL: R$ ${document.getElementById("total").innerText}*`; window.open("https://wa.me" + ZAP + "?text=" + encodeURIComponent(m), "_blank"); }
</script>
</body>
</html>
