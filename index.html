<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JCA Pesca & Bazar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#f4f6f9;padding-bottom:60px}
header{background:#0f4c81;color:#fff;padding:15px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.btn-cart{background:#25d366;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
.filtros{max-width:1000px;margin:15px auto;padding:0 15px}#busca{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.cat-btn{background:#fff;border:1px solid #ddd;padding:6px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
.cat-btn.ativa{background:#0f4c81;color:#fff}.grid{max-width:1000px;margin:0 auto;padding:0 15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;flex-direction:column;justify-content:space-between}
.card img{width:100%;height:120px;object-fit:contain;margin-bottom:8px}.preco{font-size:1.1rem;font-weight:bold;color:#0f4c81;margin:6px 0}
.btn-add{width:100%;background:#1e88e5;color:#fff;border:0;padding:9px;border-radius:6px;font-weight:bold;cursor:pointer}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;justify-content:flex-end}
.modal{background:#fff;width:100%;max-width:400px;height:100%;padding:20px;overflow-y:auto;display:flex;flex-direction:column;justify-content:space-between}
.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0}.item button{padding:2px 8px;cursor:pointer}
.campo{margin-top:10px}.campo label{display:block;font-size:.85rem;font-weight:bold;margin-bottom:4px}
.campo input,.campo select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px}
.btn-whats{width:100%;background:#25d366;color:#fff;border:0;padding:14px;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:15px}
</style>
</head>
<body>
<header><h2>JCA Pesca & Bazar</h2><button class="btn-cart" onclick="abrir()">🛒 Carrinho (<span id="qtd">0</span>)</button></header>
<div class="filtros"><input type="text" id="busca" placeholder="Buscar produto, código ou EAN..." oninput="filtrar()"><div class="cats" id="cats"></div></div>
<div class="grid" id="vitrine"><p>Carregando catálogo...</p></div>
<div class="modal-bg" id="modal"><div class="modal"><div>
<div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3>Seu Pedido</h3><button onclick="fechar()" style="border:0;background:none;font-size:1.3rem;cursor:pointer">✕</button></div>
<div id="itens"></div><h3 style="margin-top:12px;text-align:right">Total: R$ <span id="total">0,00</span></h3>
<div class="campo"><label>Seu Nome *</label><input type="text" id="nome" placeholder="Digite seu nome"></div>
<div class="campo"><label>Recebimento *</label><select id="entrega" onchange="mudarEnt()"><option value="Retirada na Loja">🏪 Retirar na Loja (Grátis)</option><option value="Entrega Local">🛵 Entrega Local / Motoboy</option><option value="Correios/Transportadora">📦 Correios / Transportadora</option></select></div>
<div class="campo" id="info-ret" style="background:#eef6ff;padding:8px;border-radius:6px;font-size:.85rem">📍 Retirada na Loja Física - São Gonçalo/RJ</div>
<div class="campo" id="box-end" style="display:none"><label>Endereço e CEP *</label><input type="text" id="end" placeholder="Rua, número, bairro, cidade e CEP"></div>
<div class="campo"><label>Pagamento</label><select id="pag"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select></div>
</div><button class="btn-whats" onclick="enviar()">🚀 Enviar no WhatsApp</button></div></div>
<script>
const URL_CSV="https://google.com";
const ZAP="5521967601536";let prods=[],cart=[],cat="Todos";
const IMG="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='120' height='120' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='1.5'><rect x='3' y='3' width='18' height='18' rx='2'/><circle cx='8.5' cy='8.5' r='1.5'/><path d='M21 15l-5-5L5 21'/></svg>";

function parseCSV(str){
  const rows=[];let row=[],cur="",inQ=false;
  for(let i=0;i<str.length;i++){
    const c=str[i],n=str[i+1];
    if(c==='"'&&inQ&&n==='"'){cur+='"';i++;}
    else if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){row.push(cur);cur="";}
    else if((c==='\n'||c==='\r')&&!inQ){if(c==='\r'&&n==='\n')i++;row.push(cur);rows.push(row);row=[];cur="";}
    else{cur+=c;}
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows;
}

fetch(URL_CSV).then(r=>r.text()).then(t=>{
  const rows=parseCSV(t);
  prods=rows.slice(1).map(c=>{
    const v=i=>(c[i]||"").trim();
    const p=parseFloat(v(3).replace("R$","").replace(/\./g,"").replace(",",".").trim())||0;
    return{nome:v(0),sku:v(1),cat:v(2)||"Geral",preco:p,foto:v(4).startsWith("http")?v(4):IMG,est:parseInt(v(5))||0,ean:v(6)};
  }).filter(p=>p.nome&&p.est>0);
  if(!prods.length){document.getElementById("vitrine").innerHTML="<p style='color:orange'>Nenhum produto com estoque > 0 na Coluna F.</p>";return;}
  document.getElementById("cats").innerHTML=["Todos",...new Set(prods.map(p=>p.cat))].map(c=>`<button class="cat-btn ${c==='Todos'?'ativa':''}" onclick="setCat('${c}',this)">${c}</button>`).join("");
  desenhar(prods);
}).catch(e=>{
  document.getElementById("vitrine").innerHTML="<p style='color:red'>Erro CSV: "+e.message+"</p>";
});

function setCat(c,b){cat=c;document.querySelectorAll(".cat-btn").forEach(x=>x.classList.remove("ativa"));b.classList.add("ativa");filtrar()}
function filtrar(){const t=document.getElementById("busca").value.toLowerCase();desenhar(prods.filter(p=>(cat==="Todos"||p.cat===cat)&&(p.nome.toLowerCase().includes(t)||p.sku.toLowerCase().includes(t)||p.ean.toLowerCase().includes(t))))}
function desenhar(l){document.getElementById("vitrine").innerHTML=l.slice(0,60).map(p=>`<div class="card"><div><img src="${p.foto}" onerror="this.src='${IMG}'"><small style="color:#777">Cód: ${p.sku}${p.ean?' | EAN: '+p.ean:''}</small><div style="font-weight:bold;margin:4px 0">${p.nome}</div></div><div><div class="preco">R$ ${p.preco.toFixed(2).replace(".",",")}</div><button class="btn-add" onclick="add('${p.sku}')">+ Adicionar</button></div></div>`).join("")||"<p>Nenhum item encontrado.</p>"}
function add(s){const p=prods.find(x=>x.sku===s);if(!p)return;const i=cart.find(x=>x.sku===s);if(i){if(i.qtd<p.est)i.qtd++;else alert("Estoque máximo.");}else cart.push({...p,qtd:1});att()}
function alt(s,d){const x=cart.findIndex(i=>i.sku===s);if(x===-1)return;const p=prods.find(i=>i.sku===s),n=cart[x].qtd+d;if(n<=0)cart.splice(x,1);else if(p&&n<=p.est)cart[x].qtd=n;att()}
function att(){document.getElementById("qtd").innerText=cart.reduce((a,b)=>a+b.qtd,0);document.getElementById("total").innerText=cart.reduce((a,b)=>a+b.preco*b.qtd,0).toFixed(2).replace(".",",");document.getElementById("itens").innerHTML=cart.length?cart.map(i=>`<div class="item"><div style="flex:1;padding-right:8px"><div style="font-weight:bold;font-size:.9rem">${i.nome}</div><small style="color:#555">R$ ${(i.preco*i.qtd).toFixed(2).replace(".",",")}</small></div><div style="display:flex;align-items:center;gap:6px"><button onclick="alt('${i.sku}',-1)">-</button><span>${i.qtd}</span><button onclick="alt('${i.sku}',1)">+</button></div></div>`).join(""):"<p style='color:#777;padding:10px 0'>Carrinho vazio.</p>"}
function abrir(){att();document.getElementById("modal").style.display="flex"}
function fechar(){document.getElementById("modal").style.display="none"}
function mudarEnt(){const e=document.getElementById("entrega").value;document.getElementById("info-ret").style.display=e==="Retirada na Loja"?"block":"none";document.getElementById("box-end").style.display=e!=="Retirada na Loja"?"block":"none"}
function enviar(){if(!cart.length)return alert("Carrinho vazio.");const n=document.getElementById("nome").value.trim(),e=document.getElementById("entrega").value,d=document.getElementById("end").value.trim(),g=document.getElementById("pag").value;if(!n)return alert("Digite seu nome.");if(e!=="Retirada na Loja"&&!d)return alert("Informe o endereço.");let t=`*Novo Pedido - JCA Pesca & Bazar*\n\n*Cliente:* ${n}\n*Recebimento:* ${e}\n`;if(e!=="Retirada na Loja")t+=`*Endereço:* ${d}\n`;t+=`*Pagamento:* ${g}\n\n*Itens:*\n`;cart.forEach(i=>t+=`• ${i.qtd}x ${i.nome} (Cód: ${i.sku}) - R$ ${(i.preco*i.qtd).toFixed(2).replace(".",",")}\n`);t+=`\n*Total: R$ ${cart.reduce((a,b)=>a+b.preco*b.qtd,0).toFixed(2).replace(".",",")}*`;window.open("https://wa.me"+ZAP+"?text="+encodeURIComponent(t),"_blank")}
</script>
</body>
</html>
