<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCA Pesca & Bazar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f4f6f9; color: #222; padding-bottom: 60px; }
    header { background: #0f4c81; color: #fff; padding: 15px; position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; }
    .btn-cart { background: #25d366; color: #fff; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .filtros { max-width: 1000px; margin: 15px auto; padding: 0 15px; }
    #busca { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; }
    .cats { display: flex; gap: 8px; overflow-x: auto; }
    .cat-btn { background: #fff; border: 1px solid #ddd; padding: 6px 14px; border-radius: 20px; cursor: pointer; }
    .cat-btn.ativa { background: #0f4c81; color: #fff; }
    .grid { max-width: 1000px; margin: 0 auto; padding: 0 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .card { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 130px; object-fit: contain; margin-bottom: 8px; }
    .preco { font-size: 1.1rem; font-weight: bold; color: #0f4c81; margin: 6px 0; }
    .btn-add { width: 100%; background: #1e88e5; color: #fff; border: none; padding: 9px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: flex-end; }
    .modal { background: #fff; width: 100%; max-width: 400px; height: 100%; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; }
    .item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 8px 0; }
    .campo { margin-top: 10px; }
    .campo label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
    .campo input, .campo select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    .btn-whats { width: 100%; background: #25d366; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

<script>
  const NOME_LOJA = "JCA Pesca & Bazar";
  const ID_PLANILHA = "1aqXlxsuLk8KuyuDr73IDyI1ZtfFqSFoIko9lYg1M2N4";
  const WHATSAPP = "5521999999999";
  const RETIRADA = "Retirada na Loja Física - São Gonçalo/RJ";
</script>

<header>
  <h2 id="titulo"></h2>
  <button class="btn-cart" onclick="abrir()">🛒 Carrinho (<span id="qtd">0</span>)</button>
</header>

<div class="filtros">
  <input type="text" id="busca" placeholder="Buscar produto ou código..." oninput="filtrar()" />
  <div class="cats" id="cats"></div>
</div>

<div class="grid" id="vitrine"><p>Carregando produtos...</p></div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div>
      <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <h3>Seu Pedido</h3>
        <button onclick="fechar()" style="border:none; background:none; font-size:1.3rem; cursor:pointer;">✕</button>
      </div>
      <div id="itens"></div>
      <h3 style="margin-top:12px; text-align:right;">Total: R$ <span id="total">0,00</span></h3>
      <div class="campo"><label>Seu Nome *</label><input id="nome" /></div>
      <div class="campo">
        <label>Recebimento *</label>
        <select id="entrega" onchange="mudarEntrega()">
          <option value="Retirada na Loja">🏪 Retirar na Loja (Grátis)</option>
          <option value="Entrega Local">🛵 Entrega Local / Motoboy</option>
          <option value="Correios/Transportadora">📦 Correios / Transportadora</option>
        </select>
      </div>
      <div class="campo" id="info-retirada" style="background:#eef6ff; padding:8px; border-radius:6px; font-size:0.85rem;"></div>
      <div class="campo" id="box-end" style="display:none;"><label>Endereço e CEP *</label><input id="end" /></div>
      <div class="campo">
        <label>Pagamento</label>
        <select id="pag"><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select>
      </div>
    </div>
    <button class="btn-whats" onclick="enviar()">🚀 Enviar no WhatsApp</button>
  </div>
</div>

<script>
  document.getElementById("titulo").innerText = NOME_LOJA;
  document.getElementById("info-retirada").innerText = "📍 " + RETIRADA;
  let produtos = [], carrinho = [], catAtual = "Todos";
  const SEM_FOTO = "https://flaticon.com";

  window.google = { visualization: { Query: { setResponse: function(res) {
    const rows = res.table.rows || [];
    produtos = rows.map(r => {
      const c = r.c || [];
      const val = (i) => (c.at(i) && c.at(i).v !== null) ? String(c.at(i).v).trim() : "";
      const num = (i) => (c.at(i) && typeof c.at(i).v === "number") ? c.at(i).v : parseFloat(val(i).replace("R$", "").replace(/\./g, "").replace(",", ".")) || 0;
      return {
        sku: val(0),
        nome: val(1),
        cat: val(2) || "Geral",
        preco: num(3),
        foto: val(4).startsWith("http") ? val(4) : SEM_FOTO,
        est: parseInt(num(5)) || 0
      };
    }).filter(x => x.nome && x.nome.toLowerCase() !== "nome" && x.est > 0);

    const listaCats = ["Todos", ...new Set(produtos.map(p => p.cat))];
    document.getElementById("cats").innerHTML = listaCats.map(c => `<button class="cat-btn ${c==='Todos'?'ativa':''}" onclick="setCat('${c}',this)">${c}</button>`).join("");
    desenhar(produtos);
  }}}};

  function carregarPlanilha() {
    const s = document.createElement("script");
    s.src = "https://google.com" + ID_PLANILHA + "/gviz/tq?tqx=out:script&gid=0";

    s.onerror = () => {
      document.getElementById("vitrine").innerHTML = "<p>Verifique se a planilha está como 'Qualquer pessoa com o link pode ver'.</p>";
    };
    document.body.appendChild(s);
  }

  function setCat(c, btn) {
    catAtual = c;
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("ativa"));
    btn.classList.add("ativa");
    filtrar();
  }

  function filtrar() {
    const t = document.getElementById("busca").value.toLowerCase();
    desenhar(produtos.filter(p => (catAtual === "Todos" || p.cat === catAtual) && (p.nome.toLowerCase().includes(t) || p.sku.includes(t))));
  }

  function desenhar(lista) {
    document.getElementById("vitrine").innerHTML = lista.slice(0, 60).map(p => `
      <div class="card">
        <div>
          <img src="${p.foto}" onerror="this.src='${SEM_FOTO}'" />
          <small style="color:#777">Cód: ${p.sku}</small>
          <div style="font-weight:bold; margin:4px 0">${p.nome}</div>
        </div>
        <div>
          <div class="preco">R$ ${p.preco.toFixed(2).replace(".", ",")}</div>
          <button class="btn-add" onclick="add('${p.sku}')">+ Adicionar</button>
        </div>
      </div>`).join("") || "<p>Nenhum item com estoque encontrado.</p>";
  }

  function add(sku) {
    const item = carrinho.find(i => i.sku === sku);
    if (item) item.qtd++; else carrinho.push({ ...produtos.find(p => p.sku === sku), qtd: 1 });
    atualizar();
  }

  function mudarQtd(sku, d) {
    const i = carrinho.findIndex(x => x.sku === sku);
    carrinho[i].qtd += d;
    if (carrinho[i].qtd <= 0) carrinho.splice(i, 1);
    atualizar();
  }

  function atualizar() {
    document.getElementById("qtd").innerText = carrinho.reduce((s, i) => s + i.qtd, 0);
    const tot = carrinho.reduce((s, i) => s + i.preco * i.qtd, 0);
    document.getElementById("total").innerText = tot.toFixed(2).replace(".", ",");
    document.getElementById("itens").innerHTML = carrinho.map(i => `
      <div class="item">
        <div><b>${i.nome}</b><br>R$ ${(i.preco*i.qtd).toFixed(2).replace(".",",")}</div>
        <div><button onclick="mudarQtd('${i.sku}',-1)">-</button> ${i.qtd} <button onclick="mudarQtd('${i.sku}',1)">+</button></div>
      </div>`).join("") || "<p>Carrinho vazio.</p>";
  }

  function abrir() { document.getElementById("modal").style.display = "flex"; atualizar(); }
  function fechar() { document.getElementById("modal").style.display = "none"; }
  function mudarEntrega() {
    const r = document.getElementById("entrega").value === "Retirada na Loja";
    document.getElementById("info-retirada").style.display = r ? "block" : "none";
    document.getElementById("box-end").style.display = r ? "none" : "block";
  }

  function enviar() {
    if (!carrinho.length) return alert("Carrinho vazio!");
    const nome = document.getElementById("nome").value.trim();
    const ent = document.getElementById("entrega").value;
    const end = document.getElementById("end").value.trim();
    if (!nome) return alert("Digite seu nome.");
    if (ent !== "Retirada na Loja" && !end) return alert("Digite endereço e CEP.");
    let msg = `*PEDIDO - ${NOME_LOJA}*\n*Cliente:* ${nome}\n*Entrega:* ${ent}\n` + (ent !== "Retirada na Loja" ? `*Endereço:* ${end}\n` : "") + `*Pagamento:* ${document.getElementById("pag").value}\n\n`;
    carrinho.forEach(i => msg += `• ${i.qtd}x ${i.nome} (Cód ${i.sku}) - R$ ${(i.preco*i.qtd).toFixed(2).replace(".",",")}\n`);
    msg += `\n*TOTAL: R$ ${document.getElementById("total").innerText}*`;
    window.open(`https://wa.me{WHATSAPP}?text=${encodeURIComponent(msg)}`, "_blank");
  }

  carregarPlanilha();
</script>
</body>
</html>
